name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # zeta on its own, without CNS: the default install, down to the declared Python floor.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

  cns:
    # The optional CNS connector (zeta.cns_connector), with the extra installed. ZETA_REQUIRE_CNS=1 turns a
    # missing cns into a failure, so these tests cannot silently skip here. CNS itself needs Python 3.10+.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with the cns extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cns]"
          python -m pip install pytest

      - name: Run the test suite with CNS present
        env:
          ZETA_REQUIRE_CNS: "1"
        run: python -m pytest tests/ -q -rs
